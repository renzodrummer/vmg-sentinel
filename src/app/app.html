<div class="app-container">
  <section class="feature-section">
    <h3>1. Time Tracker</h3>
    <div class="time-display">00:00:00</div>
    <div class="controls">
      <button>Start Timer</button>
      <button>Stop Timer</button>
    </div>
  </section>

  <hr />

  <section class="feature-section">
    <h3>2. Screen Capture</h3>
    <button>Take Screenshot</button>
  </section>

  <hr />

  <section class="feature-section">
    <h3>3. Screen Recorder</h3>
    <div class="recorder-controls" style="display: flex; gap: 5px; align-items: center">
      <button>Start</button>
      <button>Stop</button>
      <button>Get Video Sources</button>

      <select>
        <option value="" disabled selected></option>
        <option value="screen1">Screen 1</option>
        <option value="window1">Window 1</option>
      </select>
    </div>
  </section>
</div>
